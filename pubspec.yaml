name: man_wen
description: Quit porn with site blocking for adult and NSFW content.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pinned to 2.2.x — multiple constraints stacked:
  #   1. 2.5.0+ migrated to Pigeon-based IPC
  #      (channel 'dev.flutter.pigeon.shared_preferences_android.*')
  #      which the project's custom SharedPreferencesPlugin.java
  #      does not implement. That custom plugin only implements
  #      the legacy MethodChannel ('plugins.flutter.io/shared_preferences').
  #   2. 2.3.0-2.3.3 require Dart SDK >=3.5.0, but the CI's Dart
  #      is 3.4.0 (Flutter 3.22.0 stable). Stay below that boundary.
  # Until either (a) the custom plugin is rewritten to handle the
  # Pigeon channel or (b) the CI is bumped to a newer Dart, we
  # have to stay pinned here.
  shared_preferences: '>=2.2.0 <2.3.0'

# Force the *native* side to the same pre-Pigeon, pre-Dart-3.5
# version. Pinning just `shared_preferences` above is not enough
# because `shared_preferences_android` is a separate package
# pulled in transitively, and its own constraint allows 2.5+ (the
# Pigeon version). dependency_overrides forces the resolver to
# pick these exact versions regardless of what transitive
# constraints say.
dependency_overrides:
  shared_preferences: '>=2.2.0 <2.3.0'
  shared_preferences_android: '>=2.2.0 <2.3.0'
  shared_preferences_foundation: '>=2.2.0 <2.3.0'  # macOS / iOS
  shared_preferences_web: '>=2.2.0 <2.3.0'         # web
  # flutter_svg: ^2.0.10+1 would let pub pick 2.2.x, which uses
  # Color.toARGB32() — an API only in Flutter 3.27+ (Dec 2024).
  # The project is on Flutter 3.22 (Dart 3.4), so anything in
  # the 2.1+ line that adopted toARGB32 errors at compile.
  # Cap at <2.1.0 to stay on the 2.0.x line which predates the
  # toARGB32 adoption.
  flutter_svg: '>=2.0.0 <2.1.0'
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/books/