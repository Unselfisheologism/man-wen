name: man_wen
description: Quit porn with site blocking for adult and NSFW content.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pinned to 2.4.x — 2.5.0+ migrated to Pigeon-based IPC
  # (channel 'dev.flutter.pigeon.shared_preferences_android.*')
  # which the project's custom SharedPreferencesPlugin.java does
  # not implement. That custom plugin only implements the legacy
  # MethodChannel ('plugins.flutter.io/shared_preferences'). Until
  # the custom plugin is rewritten to handle the Pigeon-generated
  # handler, we have to stay on the pre-Pigeon Dart side.
  shared_preferences: ~2.4.0
  provider: ^6.1.1
  flutter_svg: ^2.0.10+1
  pdf_render: ^1.4.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/books/