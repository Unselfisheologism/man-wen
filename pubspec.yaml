name: man_wen
description: Quit porn with site blocking for adult and NSFW content.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pinned to 2.3.x — multiple constraints stacked:
  #   1. 2.5.0+ migrated to Pigeon-based IPC
  #      (channel 'dev.flutter.pigeon.shared_preferences_android.*')
  #      which the project's custom SharedPreferencesPlugin.java
  #      does not implement. That custom plugin only implements
  #      the legacy MethodChannel ('plugins.flutter.io/shared_preferences').
  #   2. >=2.3.4 requires Dart SDK >=3.5.0, but the CI's Dart is
  #      3.4.0 (Flutter 3.22.0 stable). Stay below that boundary.
  # Until either (a) the custom plugin is rewritten to handle the
  # Pigeon channel or (b) the CI is bumped to a newer Dart, we
  # have to stay pinned here.
  shared_preferences: '>=2.3.0 <2.3.4'
  provider: ^6.1.1
  flutter_svg: ^2.0.10+1
  pdf_render: ^1.4.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/books/