buildscript {
    ext.kotlin_version = '1.9.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Ensure Flutter dependencies are fetched (generates .flutter-plugins-dependencies)
def pubGetMarker = new File(rootProject.parent, ".flutter-plugins-dependencies")
if (!pubGetMarker.exists()) {
    logger.lifecycle("Running flutter pub get (plugin deps missing)...")
    try {
        def localProps = new Properties()
        rootProject.file("local.properties").withInputStream { localProps.load(it) }
        def sdk = localProps.getProperty("flutter.sdk")
        if (sdk != null) {
            def process = ["$sdk/bin/flutter", "pub", "get"].execute(null, rootProject.parent)
            process.waitFor()
            if (process.exitValue() != 0) {
                logger.warn("flutter pub get failed: ${process.errorStream.text}")
            }
        }
    } catch (Exception e) {
        logger.warn("Could not run flutter pub get: ${e.message}")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
