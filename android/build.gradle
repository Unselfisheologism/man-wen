buildscript {
    ext.kotlin_version = '1.9.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Generate .flutter-plugins-dependencies before Flutter plugin reads it
def pubGetMarker = new File(rootProject.projectDir.parentFile, ".flutter-plugins-dependencies")
if (!pubGetMarker.exists()) {
    logger.lifecycle(">>> Running flutter pub get to generate plugin deps...")
    try {
        def localProps = new Properties()
        rootProject.file("local.properties").withInputStream { localProps.load(it) }
        def sdk = localProps.getProperty("flutter.sdk")
        if (sdk != null) {
            def proc = ["$sdk/bin/flutter", "pub", "get"].execute(null, rootProject.projectDir.parentFile)
            proc.waitFor()
            if (proc.exitValue() != 0) {
                logger.warn(">>> flutter pub get failed: ${proc.errorStream.text}")
            } else {
                logger.lifecycle(">>> flutter pub get succeeded")
            }
        }
    } catch (Exception e) {
        logger.warn(">>> flutter pub get error: ${e.message}")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
