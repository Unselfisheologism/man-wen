pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

// Compile stub for com.android.build.OutputFile (removed in AGP 8.x, needed by Flutter 3.22)
// Also patch Flutter plugin source to remove OutputFile reference
def flutterSdkStubs = {
    def props = new Properties()
    file("local.properties").withInputStream { props.load(it) }
    return props.getProperty("flutter.sdk")
}()
def flutterGroovyFile = new File(flutterSdkStubs, "packages/flutter_tools/gradle/src/main/groovy/flutter.groovy")
if (flutterGroovyFile.exists()) {
    def content = flutterGroovyFile.text
    // Replace OutputFile references (removed in AGP 8.x) with a compatible type
    if (content.contains("com.android.build.OutputFile")) {
        logger.lifecycle(">>> Patching flutter.groovy for AGP 8.x OutputFile compatibility...")
        flutterGroovyFile.text = content.replaceAll("com\\.android\\.build\\.OutputFile", "Object")
    }
}

rootProject.name = 'ManWen'
include ':app'
