pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

// Compile stub for com.android.build.OutputFile (removed in AGP 8.x, needed by Flutter 3.22)
// Patch Flutter plugin source and provide OutputFile stub (removed in AGP 8.x)
def flutterSdkStubs = {
    def props = new Properties()
    file("local.properties").withInputStream { props.load(it) }
    return props.getProperty("flutter.sdk")
}()
def pluginSrcDir = new File(flutterSdkStubs, "packages/flutter_tools/gradle/src/main/groovy")
def flutterGroovyFile = new File(pluginSrcDir, "flutter.groovy")
if (flutterGroovyFile.exists()) {
    def content = flutterGroovyFile.text
    if (content.contains("com.android.build.OutputFile")) {
        logger.lifecycle(">>> Patching flutter.groovy for AGP 8.x OutputFile compatibility...")
        flutterGroovyFile.text = content.replaceAll("com\\.android\\.build\\.OutputFile", "Object")
    }
    // Also place OutputFile.java stub in the plugin source so it gets compiled into the JAR
    def stubFile = new File(pluginSrcDir, "OutputFile.java")
    if (!stubFile.exists()) {
        logger.lifecycle(">>> Adding OutputFile.java stub to Flutter plugin sources...")
        stubFile.text = """// Stub for AGP 8.x compatibility
package com.android.build;
public interface OutputFile {}"""
    }
}

rootProject.name = 'ManWen'
include ':app'
