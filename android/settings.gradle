// Compute Flutter SDK path once (needed in pluginManagement and for pub get)
def getFlutterSdkPath() {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def sdk = properties.getProperty("flutter.sdk")
    assert sdk != null, "flutter.sdk not set in local.properties"
    return sdk
}

pluginManagement {
    def flutterSdkPath = getFlutterSdkPath()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Ensure Flutter dependencies are fetched (generates .flutter-plugins-dependencies)
def pubGetMarker = new File(rootDir.parentFile, ".flutter-plugins-dependencies")
if (!pubGetMarker.exists()) {
    logger.lifecycle("Running flutter pub get...")
    def sdk = getFlutterSdkPath()
    def process = ["$sdk/bin/flutter", "pub", "get"].execute(null, rootDir.parentFile)
    process.waitFor()
    if (process.exitValue() != 0) {
        logger.warn("flutter pub get failed (${process.exitValue()}): ${process.errorStream.text}")
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

rootProject.name = 'ManWen'
include ':app'
