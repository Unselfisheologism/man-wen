pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

// NOTE: Flutter 3.22's flutter.groovy references com.android.build.OutputFile,
// which was removed in AGP 8.0. The patch is applied in CI by
// scripts/patch-flutter-sdk.sh before gradle runs, which:
//   1. sed-replaces the import + usage in the Flutter SDK's flutter.groovy
//   2. clears the gradle compile cache so the patched source is recompiled
// For local builds: run `bash scripts/patch-flutter-sdk.sh` before `flutter build apk`.

rootProject.name = 'ManWen'
include ':app'
