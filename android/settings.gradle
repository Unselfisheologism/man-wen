pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Compile stub for com.android.build.OutputFile (removed in AGP 8.x, needed by Flutter 3.22)
def stubsDir = new File(rootDir, "buildscript-stubs")
def classesDir = new File(stubsDir, "classes")
def marker = new File(classesDir, "com/android/build/OutputFile.class")
if (!marker.exists()) {
    def srcFile = new File(stubsDir, "src/com/android/build/OutputFile.java")
    classesDir.mkdirs()
    logger.lifecycle(">>> Compiling OutputFile stub...")
    def javac = ["javac", "-d", classesDir.absolutePath, srcFile.absolutePath].execute()
    javac.waitFor()
    if (javac.exitValue() != 0) {
        logger.warn(">>> javac failed: ${javac.errorStream.text}")
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

rootProject.name = 'ManWen'
include ':app'
