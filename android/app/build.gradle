plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.manwen.app"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.manwen.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def storeFilePath = keystoreProperties.getProperty('storeFile')
                def storePassword = keystoreProperties.getProperty('storePassword')
                def keyAlias = keystoreProperties.getProperty('keyAlias')
                def keyPassword = keystoreProperties.getProperty('keyPassword')
                if (storeFilePath != null && storeFilePath.trim() != '' &&
                    storePassword != null && storePassword.trim() != '' &&
                    keyAlias != null && keyAlias.trim() != '' &&
                    keyPassword != null && keyPassword.trim() != '') {
                    storeFile file(storeFilePath)
                    storePassword storePassword
                    keyAlias keyAlias
                    keyPassword keyPassword
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

flutter {
    source = "../.."
}

// Read Flutter engine version from SDK so we can add the embedding explicitly
def getFlutterEngineVersion() {
    try {
        def localProps = new Properties()
        rootProject.file("local.properties").withInputStream {
            localProps.load(it)
        }
        def flutterSdk = localProps.getProperty("flutter.sdk")
        if (flutterSdk == null || flutterSdk.trim().isEmpty()) return null

        def versionFile = file("$flutterSdk/bin/cache/engineVersion")
        if (!versionFile.exists()) versionFile = file("$flutterSdk/bin/cache/engine.stamp")
        if (!versionFile.exists()) versionFile = file("$flutterSdk/bin/internal/engine.version")
        if (!versionFile.exists()) return null

        return versionFile.text.trim()
    } catch (Exception ignored) {
        return null
    }
}

def flutterEngineVersion = getFlutterEngineVersion()

 dependencies {
     // Room
     implementation "androidx.room:room-runtime:2.6.1"
     implementation "androidx.room:room-ktx:2.6.1"
     kapt "androidx.room:room-compiler:2.6.1"

     // DataStore
     implementation "androidx.datastore:datastore-preferences:1.0.0"

     // Billing
     implementation "com.android.billingclient:billing:6.0.1"

     // Biometrics
     implementation "androidx.biometric:biometric:1.1.0"

     // Activity KTX
     implementation "androidx.activity:activity-ktx:1.7.2"

     // Fragment (needed for FragmentActivity)
     implementation "androidx.fragment:fragment-ktx:1.6.2"

     // Material Design
     implementation "com.google.android.material:material:1.12.0"

     // Core AndroidX libraries
     implementation "androidx.core:core-ktx:1.13.1"
     implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

     // Explicit Flutter embedding dependency (compileOnly — Flutter plugin provides at runtime)
     if (flutterEngineVersion != null && !flutterEngineVersion.isEmpty()) {
         compileOnly "io.flutter:flutter_embedding_release:1.0.0-$flutterEngineVersion"
     }
 }
