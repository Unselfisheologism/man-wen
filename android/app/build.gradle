plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.manwen.app"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.manwen.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def storeFilePath = keystoreProperties.getProperty('storeFile')
                def storePasswordVal = keystoreProperties.getProperty('storePassword')
                def keyAliasVal = keystoreProperties.getProperty('keyAlias')
                def keyPasswordVal = keystoreProperties.getProperty('keyPassword')
                if (storeFilePath != null && storeFilePath.trim() != '' &&
                    storePasswordVal != null && storePasswordVal.trim() != '' &&
                    keyAliasVal != null && keyAliasVal.trim() != '' &&
                    keyPasswordVal != null && keyPasswordVal.trim() != '') {
                    storeFile file(storeFilePath)
                    storePassword(storePasswordVal)
                    keyAlias(keyAliasVal)
                    keyPassword(keyPasswordVal)
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

// Flutter engine classes + native libs from the SDK engine cache.
// Required for compile classpath: the Flutter Gradle plugin's Maven AAR does
// not put io.flutter.embedding.* on the app module's compile classpath under
// AGP 8.x + Flutter 3.22 (the includeBuild composite build only registers the
// plugin tasks, not the embedding classes). Without this jar, MainActivity.kt
// fails with 'Unresolved reference: FlutterActivity / FlutterEngine'.
//
// We declare it as compileOnly to avoid the runtime classloader conflict that
// would occur if both this jar and the Maven AAR were on the runtime classpath
// simultaneously. The runtime embedding classes are provided by the AAR
// (the Maven AAR does ship io.flutter.embedding.* in its classes.jar), and
// the native libs come from the AAR's jni/<abi>/libflutter.so for all 4 ABIs.
def getFlutterEngineDir() {
    try {
        String sdk = null
        def localProps = rootProject.file("local.properties")
        if (localProps.exists()) {
            def props = new Properties()
            localProps.withInputStream { props.load(it) }
            sdk = props.getProperty("flutter.sdk")
        }
        if (sdk == null && System.env.FLUTTER_ROOT != null) {
            sdk = System.env.FLUTTER_ROOT
        }
        if (sdk == null) return null
        def dir = file("$sdk/bin/cache/artifacts/engine/android-arm-release")
        if (!dir.exists()) dir = file("$sdk/bin/cache/artifacts/engine/android-arm")
        if (!dir.exists()) return null
        return dir
    } catch (Exception ignored) { return null }
}

def flutterEngineDir = getFlutterEngineDir()

flutter {
    source = "../.."
}

dependencies {
     // Room
     implementation "androidx.room:room-runtime:2.6.1"
     implementation "androidx.room:room-ktx:2.6.1"
     kapt "androidx.room:room-compiler:2.6.1"

     // DataStore
     implementation "androidx.datastore:datastore-preferences:1.0.0"

     // Billing
     implementation "com.android.billingclient:billing:6.0.1"

     // Biometrics
     implementation "androidx.biometric:biometric:1.1.0"

     // Activity KTX
     implementation "androidx.activity:activity-ktx:1.7.2"

     // Fragment (needed for FragmentActivity)
     implementation "androidx.fragment:fragment-ktx:1.6.2"

     // Material Design
     implementation "com.google.android.material:material:1.12.0"

     // Core AndroidX libraries
     implementation "androidx.core:core-ktx:1.13.1"
     implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

     // Flutter engine - compileOnly only (see comment above)
     if (flutterEngineDir != null && flutterEngineDir.exists()) {
         compileOnly files("$flutterEngineDir/flutter.jar")
     }
}
