plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.manwen.app"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.manwen.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def storeFilePath = keystoreProperties.getProperty('storeFile')
                def storePasswordVal = keystoreProperties.getProperty('storePassword')
                def keyAliasVal = keystoreProperties.getProperty('keyAlias')
                def keyPasswordVal = keystoreProperties.getProperty('keyPassword')
                if (storeFilePath != null && storeFilePath.trim() != '' &&
                    storePasswordVal != null && storePasswordVal.trim() != '' &&
                    keyAliasVal != null && keyAliasVal.trim() != '' &&
                    keyPasswordVal != null && keyPasswordVal.trim() != '') {
                    storeFile file(storeFilePath)
                    storePassword(storePasswordVal)
                    keyAlias(keyAliasVal)
                    keyPassword(keyPasswordVal)
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

// NOTE: A previous version of this file pulled in flutter.jar from the SDK
// engine cache (commit 2cd87d0) as a workaround for the Flutter 3.22 +
// AGP 8.x com.android.build.OutputFile NoClassDefFoundError. That issue is
// now fixed by scripts/patch-flutter-sdk.sh which sed-patches the Flutter
// SDK's flutter.groovy at CI time. With the workaround gone, the Flutter
// plugin's Maven AAR is the sole source of io.flutter.embedding.* classes
// and libflutter.so - no more duplicate-class classloader conflict on launch.

flutter {
    source = "../.."
}

dependencies {
     // Room
     implementation "androidx.room:room-runtime:2.6.1"
     implementation "androidx.room:room-ktx:2.6.1"
     kapt "androidx.room:room-compiler:2.6.1"

     // DataStore
     implementation "androidx.datastore:datastore-preferences:1.0.0"

     // Billing
     implementation "com.android.billingclient:billing:6.0.1"

     // Biometrics
     implementation "androidx.biometric:biometric:1.1.0"

     // Activity KTX
     implementation "androidx.activity:activity-ktx:1.7.2"

     // Fragment (needed for FragmentActivity)
     implementation "androidx.fragment:fragment-ktx:1.6.2"

     // Material Design
     implementation "com.google.android.material:material:1.12.0"

     // Core AndroidX libraries
     implementation "androidx.core:core-ktx:1.13.1"
     implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
}
